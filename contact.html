
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Hiranmai Kuna through the accessible portfolio contact form.">

    <title>Contact | Hiranmai Kuna</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Contact Me</h1>

    <nav aria-label="Main navigation">

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="projects.html">Projects</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>

<main>

    <section aria-labelledby="contact-heading">

        <h2 id="contact-heading">
            Get in Touch
        </h2>

        <form aria-label="Contact form">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
                autocomplete="name"
            >

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>

    <p>&copy; 2026 Hiranmai Kuna</p>

</footer>

</body>

</html>
